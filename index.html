<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de resistencias eléctricas de 4 y 5 bandas. Calcula valores teóricos, rangos y estados.">
    <title>Resistor Pro - Calculadora de Resistencias</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="calculator-container">
        <header>
            <h1>Resistor <span class="accent">Pro</span></h1>
            <p>Calculadora de precisión para 4 y 5 bandas</p>
        </header>
        
        <div class="mode-selector">
            <button id="mode-4" class="mode-btn active">4 Bandas</button>
            <button id="mode-5" class="mode-btn">5 Bandas</button>
        </div>

        <div class="resistor-visual-container">
            <div class="wire left-wire"></div>
            <div class="resistor-body" id="resistor-body">
                <div class="band band-1" id="visual-band-1"></div>
                <div class="band band-2" id="visual-band-2"></div>
                <div class="band band-3" id="visual-band-3"></div>
                <div class="band band-4" id="visual-band-4"></div>
                <div class="band band-5 hidden" id="visual-band-5"></div>
            </div>
            <div class="wire right-wire"></div>
        </div>

        <div class="controls-grid">
            <div class="input-group" id="group-1">
                <label for="band-1">Banda 1 (1º Dígito)</label>
                <div class="select-wrapper">
                    <select id="band-1"></select>
                </div>
            </div>
            <div class="input-group" id="group-2">
                <label for="band-2">Banda 2 (2º Dígito)</label>
                <div class="select-wrapper">
                    <select id="band-2"></select>
                </div>
            </div>
            <div class="input-group hidden" id="group-3">
                <label for="band-3">Banda 3 (3º Dígito)</label>
                <div class="select-wrapper">
                    <select id="band-3"></select>
                </div>
            </div>
            <div class="input-group" id="group-4">
                <label for="band-multiplier">Multiplicador</label>
                <div class="select-wrapper">
                    <select id="band-multiplier"></select>
                </div>
            </div>
            <div class="input-group" id="group-5">
                <label for="band-tolerance">Tolerancia</label>
                <div class="select-wrapper">
                    <select id="band-tolerance"></select>
                </div>
            </div>
        </div>

        <div class="results-grid">
            <div class="result-card primary">
                <span class="label">Valor Técnico</span>
                <h2 id="theoretical-value">10 Ω</h2>
                <span id="tolerance-display" class="badge">±5%</span>
            </div>
            
            <div class="result-card">
                <span class="label">Rango Mínimo</span>
                <p id="min-value">9.5 Ω</p>
            </div>
            
            <div class="result-card">
                <span class="label">Rango Máximo</span>
                <p id="max-value">10.5 Ω</p>
            </div>

            <div class="result-card highlight">
                <span class="label">Lectura Multímetro (Aprox.)</span>
                <p id="multimeter-value">9.8 Ω</p>
            </div>

            <div class="result-card status-card">
                <span class="label">Estado</span>
                <p id="status-value">Excelente</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
