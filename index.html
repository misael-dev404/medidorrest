<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora de resistencias eléctricas de 4 bandas. Calcula valores teóricos, máximos y mínimos.">
    <title>Calculadora de Resistencias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Calculadora de Resistencias</h1>
        
        <div class="resistor-visual">
            <div class="wire"></div>
            <div class="resistor-body">
                <div class="band band-1" id="visual-band-1"></div>
                <div class="band band-2" id="visual-band-2"></div>
                <div class="band band-3" id="visual-band-3"></div>
                <div class="band band-4" id="visual-band-4"></div>
            </div>
            <div class="wire"></div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="band-1">Banda 1 (1º Dígito)</label>
                <select id="band-1">
                    <option value="brown" style="background-color: sienna; color: white;">Marrón (1)</option>
                    <option value="red" style="background-color: red; color: white;">Rojo (2)</option>
                    <option value="orange" style="background-color: darkorange; color: white;">Naranja (3)</option>
                    <option value="yellow" style="background-color: yellow; color: black;">Amarillo (4)</option>
                    <option value="green" style="background-color: green; color: white;">Verde (5)</option>
                    <option value="blue" style="background-color: blue; color: white;">Azul (6)</option>
                    <option value="violet" style="background-color: violet; color: white;">Violeta (7)</option>
                    <option value="gray" style="background-color: gray; color: white;">Gris (8)</option>
                    <option value="white" style="background-color: white; color: black;">Blanco (9)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="band-2">Banda 2 (2º Dígito)</label>
                <select id="band-2">
                    <option value="black" style="background-color: black; color: white;">Negro (0)</option>
                    <option value="brown" style="background-color: sienna; color: white;">Marrón (1)</option>
                    <option value="red" style="background-color: red; color: white;">Rojo (2)</option>
                    <option value="orange" style="background-color: darkorange; color: white;">Naranja (3)</option>
                    <option value="yellow" style="background-color: yellow; color: black;">Amarillo (4)</option>
                    <option value="green" style="background-color: green; color: white;">Verde (5)</option>
                    <option value="blue" style="background-color: blue; color: white;">Azul (6)</option>
                    <option value="violet" style="background-color: violet; color: white;">Violeta (7)</option>
                    <option value="gray" style="background-color: gray; color: white;">Gris (8)</option>
                    <option value="white" style="background-color: white; color: black;">Blanco (9)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="band-3">Banda 3 (Multiplicador)</label>
                <select id="band-3">
                    <option value="black" style="background-color: black; color: white;">Negro (x1)</option>
                    <option value="brown" style="background-color: sienna; color: white;">Marrón (x10)</option>
                    <option value="red" style="background-color: red; color: white;">Rojo (x100)</option>
                    <option value="orange" style="background-color: darkorange; color: white;">Naranja (x1k)</option>
                    <option value="yellow" style="background-color: yellow; color: black;">Amarillo (x10k)</option>
                    <option value="green" style="background-color: green; color: white;">Verde (x100k)</option>
                    <option value="blue" style="background-color: blue; color: white;">Azul (x1M)</option>
                    <option value="violet" style="background-color: violet; color: white;">Violeta (x10M)</option>
                    <option value="gray" style="background-color: gray; color: white;">Gris (x100M)</option>
                    <option value="white" style="background-color: white; color: black;">Blanco (x1G)</option>
                    <option value="gold" style="background-color: gold; color: black;">Oro (x0.1)</option>
                    <option value="silver" style="background-color: silver; color: black;">Plata (x0.01)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="band-4">Banda 4 (Tolerancia)</label>
                <select id="band-4">
                    <option value="brown" style="background-color: sienna; color: white;">Marrón (±1%)</option>
                    <option value="red" style="background-color: red; color: white;">Rojo (±2%)</option>
                    <option value="green" style="background-color: green; color: white;">Verde (±0.5%)</option>
                    <option value="blue" style="background-color: blue; color: white;">Azul (±0.25%)</option>
                    <option value="violet" style="background-color: violet; color: white;">Violeta (±0.1%)</option>
                    <option value="gray" style="background-color: gray; color: white;">Gris (±0.05%)</option>
                    <option value="gold" selected style="background-color: gold; color: black;">Oro (±5%)</option>
                    <option value="silver" style="background-color: silver; color: black;">Plata (±10%)</option>
                </select>
            </div>
        </div>

        <div class="results">
            <div class="result-card">
                <h3>Valor Teórico</h3>
                <div style="display: flex; justify-content: center; align-items: baseline;">
                    <p id="theoretical-value" class="highlight">10 Ω</p>
                    <span id="tolerance-display" class="tolerance">±5%</span>
                </div>
            </div>
            <div class="result-range">
                <div class="range-card">
                    <h4>Mínimo (- Tol.)</h4>
                    <p id="min-value">9.5 Ω</p>
                </div>
                <div class="range-card">
                    <h4>Máximo (+ Tol.)</h4>
                    <p id="max-value">10.5 Ω</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
